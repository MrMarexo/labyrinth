name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Types, lint and unit tests
    runs-on: ubuntu-latest
    env:
      # next.config.js unconditionally imports src/env.js, and `next lint`
      # loads next.config.js to read its settings. This job never touches a
      # database, so there is nothing valid to give DATABASE_URL,
      # DATABASE_URL_UNPOOLED or BETTER_AUTH_SECRET — skip the check instead.
      SKIP_ENV_VALIDATION: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test

  database:
    name: Integration and end-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Create an isolated Neon branch
        id: neon
        # SHA-pinned: this action receives NEON_API_KEY, and `v5` is a
        # floating tag. It currently points at a commit that is not any
        # release (identical action.yml to v5.2.0), so pin the release.
        uses: neondatabase/create-branch-action@ad7325f8b2fe61e29689926c29d153e8c98b7336 # v5.2.0
        with:
          project_id: ${{ secrets.NEON_PROJECT_ID }}
          branch_name: ci-${{ github.run_id }}
          # Required by the action, no default. Matches this project's role.
          username: neondb_owner
          api_key: ${{ secrets.NEON_API_KEY }}

      # drizzle-kit reads DATABASE_URL_UNPOOLED (direct connection — DDL needs
      # session state a transaction-mode pooler does not guarantee), but
      # drizzle.config.ts imports the whole `env` object, which validates
      # DATABASE_URL and BETTER_AUTH_SECRET too even though this step never
      # uses them. All three are required here for that reason.
      - name: Apply migrations
        run: pnpm db:migrate
        env:
          DATABASE_URL: ${{ steps.neon.outputs.db_url_with_pooler }}
          DATABASE_URL_UNPOOLED: ${{ steps.neon.outputs.db_url }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}

      # Spec §14 gates on a production build. Playwright's webServer also
      # builds, but a compile error there reads as a 180s server timeout;
      # here it reads as a failed build.
      - name: Production build
        run: pnpm build
        env:
          DATABASE_URL: ${{ steps.neon.outputs.db_url_with_pooler }}
          DATABASE_URL_UNPOOLED: ${{ steps.neon.outputs.db_url }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}

      - run: pnpm test:integration
        env:
          DATABASE_URL: ${{ steps.neon.outputs.db_url_with_pooler }}
          DATABASE_URL_UNPOOLED: ${{ steps.neon.outputs.db_url }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          BETTER_AUTH_URL: http://127.0.0.1:3000

      - name: Install browsers
        run: pnpm exec playwright install --with-deps chromium webkit

      - run: pnpm e2e
        env:
          DATABASE_URL: ${{ steps.neon.outputs.db_url_with_pooler }}
          DATABASE_URL_UNPOOLED: ${{ steps.neon.outputs.db_url }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          BETTER_AUTH_URL: http://127.0.0.1:3000

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      - name: Delete the branch
        if: always()
        uses: neondatabase/delete-branch-action@4468d825d5a88ef4012f1705a82f02ec3072f776 # v3.2.1
        with:
          project_id: ${{ secrets.NEON_PROJECT_ID }}
          branch: ci-${{ github.run_id }}
          api_key: ${{ secrets.NEON_API_KEY }}
